[project]
name = "sales-agent-engine"
version = "0.1.0"
description = "RoleSync Sales Agent Engine: LangGraph orchestrator, gated tools, autonomy layer"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
markers = [
    "integration: needs the local Postgres + Redis from backend/docker-compose.yml",
]
filterwarnings = [
    "ignore::DeprecationWarning:py_eureka_client.*",
]
