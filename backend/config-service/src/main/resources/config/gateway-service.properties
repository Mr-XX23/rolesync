cors.allowed-origins=${FRONTEND_URL}
cors.allowed-methods=${CORS_ALLOWED_METHODS}
cors.allowed-headers=${CORS_ALLOWED_HEADERS}
cors.allow-credentials=${ALLOW_CREDENTIALS}
# Preflight cache duration (seconds) - 600s = 10 minutes
cors.max-age=${CORS_MAX_AGE}

# Edge JWT authentication
# The gateway verifies the RS256 access_token cookie against auth-service's JWKS,
# strips any client-supplied X-User-Id/X-Auth-User-Id/X-User-Email, and injects
# the verified identity downstream. Public prefixes pass through without a token
# (auth-service self-authenticates; Composio webhooks verify by signature).
gateway.security.jwks-uri=${GATEWAY_JWKS_URI:http://auth-service:8082/api/v1/auth/oauth2/jwks}
gateway.security.issuer=${JWT_ISSUER:rolesync-micro-authservice}
gateway.security.public-paths=${GATEWAY_PUBLIC_PATHS:/api/v1/auth/,/api/v1/webhooks/}

# Deduplicate CORS response headers from downstream services
spring.cloud.gateway.default-filters[0]=DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

# Eureka configuration
eureka.client.service-url.defaultZone=${EUREKA_SERVER}
eureka.instance.prefer-ip-address=${PREFER_IP_ADDRESS}
eureka.instance.hostname=${GATEWAY_SERVER_HOSTNAME}
eureka.instance.instance-id=${spring.application.name}:${server.port}

# Route configuration

spring.cloud.gateway.routes[0].id=auth-service
spring.cloud.gateway.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.routes[1].id=workspace
spring.cloud.gateway.routes[1].uri=lb://WORKSPACE
spring.cloud.gateway.routes[1].predicates[0]=Path=/api/v1/workspaces/**

spring.cloud.gateway.routes[2].id=data-pipeline
spring.cloud.gateway.routes[2].uri=lb://DATA-PIPELINE
spring.cloud.gateway.routes[2].predicates[0]=Path=/api/v1/webhooks/**, /api/v1/connectors/**, /api/v1/data-pipeline/**, /api/v1/knowledge-vault/**, /api/v1/catalog/**

spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=lb://AUTH-SERVICE
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/v1/auth/**

spring.cloud.gateway.server.webflux.routes[1].id=workspace
spring.cloud.gateway.server.webflux.routes[1].uri=lb://WORKSPACE
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/v1/workspaces/**

spring.cloud.gateway.server.webflux.routes[2].id=data-pipeline
spring.cloud.gateway.server.webflux.routes[2].uri=lb://DATA-PIPELINE
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/v1/webhooks/**, /api/v1/connectors/**, /api/v1/data-pipeline/**, /api/v1/knowledge-vault/**, /api/v1/catalog/**
